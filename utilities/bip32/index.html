<!DOCTYPE html>
<!--
以下是实现的指导文档 (不要删除!):

# BIP 32 可视化

## 项目风格

单文件, script tag 仅允许加载 ./index.mjs module

## 方案

### 标题

不需要大标题.

### 输入框: 用于生成子树的根节点

有一个输入框, 提示用户输入 "种子 / [xt]{pub,prv}".
根据输入自动检测输入的是什么: 16 进制文本, xprv, xpub, tprv, tpub.
输入会被校验, 16 进制文本需要是偶数字符, 其它的 base58 check 编码的文本也会被校验.
输入框会响应合法的变更, 每次变更会重新生成整棵 (子) 树, 不需要按回车.

校验不通过时的报错信息:
- hex 字符数为奇数: "hex 需要偶数字符"
- hex 字节数不在 16-64 范围: "seed: 16-64 字节 (32-128 hex), 当前 N 字节"
- base58check 编码的文本校验失败: 透传 deserialize 抛出的异常信息
- 既不是 hex 也不是 `[xt]{pub,prv}` 开头: "无法识别的格式"

如果输入的是 seed, 那么页面上的根节点就是 master extended private key.
否则, 是相应的扩展子私钥或子公钥, 如果 depth = 0, 那也是 master key.

### 信息栏

根据输入, 显示 (子) 树根节点的信息:

- type: `public` 或 `private`
- network: `mainnet` 或 `testnet`
- depth
- index: 仅 depth > 0 时显示, 硬化派生取模后加 `'`
- parent fingerprint: 仅 depth > 0 时显示
- identifier: 20 字节, 前 4 字节 (fingerprint) 高亮显示

### 绘图区

#### 节点显示

整棵树的根节点会标注 m/M, 其它节点标注 index, 硬化派生的 index 会被取模然后加 `'` 后缀.

注意, 绘图区的根节点未必就是 master, 可能只是来自某棵树的内部节点.

#### 节点的 path 输入框

节点右下角有一个小圆形 `+` 按钮, 点击后在按钮旁弹出输入框.
再次点击同一个 `+` 会收起输入框, 输入到一半的文本会被保留, 下次点击时恢复.
只有点击 `+` 按钮才能收起输入框, 点击其它地方不会收起.
派生成功后草稿被清除.

输入框用来输入自该节点开始要派生的路径, 输入完按回车确认后, 一次性全部派生.
输入多次, 会生成多颗子树, 但会执行归并.

仅要求输入以 `/` 打头.

#### 节点的备注信息

备注来自 path 输入框.

1. 获取当前节点输入的 path
2. 按照 `/[^/]*` 分组
3. 对于第 N 个分组,
4. trim 掉开头的 `/` 字符
5. trim 掉末尾的空白字符
6. trim 掉末尾的 `['Hh]` 单个字符
7. 从开头开始 parseInt, trim 掉成功 parse 的部分
8. trim 剩下的文本的首位空白
9. 作为第 N 代子节点的备注信息

#### 点击节点

显示 c (chain code) 和 k (私钥) (若可获得).
再次点击显示 K (公钥).

点击会切换显示.

#### 右击节点

会弹出菜单, 无法执行的操作不会出现在菜单中.

##### 删除按钮

用于删除整棵子树.

根节点不允许删除.

##### 导出序列化的 key

可以选择导出 prv 或 pub 的 base58 check 编码.

导出时, 根据是 mainnet 还是 testnet, 自动显示 xprv/tprv 和 xpub/tpub.

导出的密钥以文件形式下载, 后缀是 txt.

文件名主体是路径上每个节点各自提供一段文本, 然后用 `-` 拼接.

如果导出 pub key:
如果根节点是 master, 则根节点提供 `M`; 否则最后一个节点在提供的文本后额外接个 `N`.

如果导出 prv key, 根节点提供 `m`.

中间节点提供自己的 index number (硬化派生使用取模后的), 如果是硬化派生, 追加一个 `H`.

#### 节点连线

父节点与子节点之间用曲线连接.

硬化派生使用虚线, 普通派生使用实线.

子节点先按照 index 排序, 如果普通派生和硬化派生的 index 相同, 普通派生在前, 硬化派生在后.
-->


<html>
<head>
<meta charset="utf-8">
<style>

body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 16px; }

<body>

<div id="input-section">
  <input id="seed-input" type="text" placeholder="种子 (hex) / xprv / xpub / tprv / tpub" spellcheck="false" autocomplete="off">
  <span id="input-type"></span>
</div>
<div id="input-error"></div>
<div id="info-section"></div>
<div id="tree-container">
  <svg id="tree-svg"></svg>
</div>
<div id="context-menu"></div>
<div id="path-popup"><input type="text" placeholder="/path" spellcheck="false" autocomplete="off"></div>

<script type="module">
import { XKey, XPrv, XPub } from './index.mjs'

const HARDENED = 2 ** 31
const NODE_R = 20
const H_GAP = 80      // horizontal spacing between leaf centers
const V_GAP = 90       // vertical spacing between levels
const TOP_PAD = 40     // top padding inside SVG
const SIDE_PAD = 80    // side padding

// ── State ──

let rootKey = null
let isMaster = false
let treeRoot = null

class TreeNode {
  constructor(key, parent) {
    this.key = key
    this.children = []
    this.parent = parent || null
    this.annotation = ''
    this.infoState = 0   // 0: hidden, 1: c+k, 2: K
    this.x = 0
    this.y = 0
  }

  get index() { return this.key.i }
  get isHardened() { return this.index >= HARDENED }
  get displayIndex() {
    return this.isHardened ? (this.index - HARDENED) + "'" : String(this.index)
  }
  get label() {
    if (!this.parent) return this.key.is_public_key() ? 'M' : 'm'
    return this.displayIndex
  }

  sortChildren() {
    this.children.sort((a, b) => {
      const am = a.isHardened ? a.index - HARDENED : a.index
      const bm = b.isHardened ? b.index - HARDENED : b.index
      if (am !== bm) return am - bm
      return (a.isHardened ? 1 : 0) - (b.isHardened ? 1 : 0)
    })
  }

  findChild(index) {
    return this.children.find(c => c.index === index)
  }

  fileSegment() {
    const mod = this.isHardened ? this.index - HARDENED : this.index
    return String(mod) + (this.isHardened ? 'H' : '')
  }

  pathFromRoot() {
    const p = []
    for (let n = this; n; n = n.parent) p.unshift(n)
    return p
  }
}

// ── Helpers ──

function toHex(bytes) {
  return [...bytes].map(b => b.toString(16).padStart(2, '0')).join('')
}

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2)
  for (let i = 0; i < bytes.length; i++)
    bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16)
  return bytes
}

// ── Annotation parsing (spec steps 1-9) ──

function parseAnnotations(pathStr) {
  const groups = pathStr.match(/\/[^/]*/g) || []
  return groups.map(g => {
    let s = g.slice(1)                  // step 4: trim leading /
    s = s.replace(/\s+$/, '')           // step 5: trim trailing whitespace
    s = s.replace(/['Hh]$/, '')         // step 6: trim trailing hardened char
    const m = s.match(/^\d+/)           // step 7: parseInt from start
    if (m) s = s.slice(m[0].length)     //         trim parsed digits
    return s.trim()                     // step 8: trim remaining whitespace
  })
}

// ── Derivation path parsing ──

function parseIndices(pathStr) {
  const cleaned = pathStr.toLowerCase().replace(/\s/g, '')
  if (!cleaned.startsWith('/')) return null
  const raw = cleaned.replace(/\/+$/, '')  // trim trailing slashes
  if (raw === '') return null
  const parts = raw.slice(1).split('/')
  return parts.map(p => {
    const hardened = p.endsWith("'") || p.endsWith('h')
    const num = parseInt(p) || 0
    return num + (hardened ? HARDENED : 0)
  })
}

// ── Derive and merge into tree ──

async function derivePath(node, pathStr) {
  const indices = parseIndices(pathStr)
  const annotations = parseAnnotations(pathStr)
  if (!indices || indices.length === 0) return

  let current = node
  for (let i = 0; i < indices.length; i++) {
    const idx = indices[i]
    let child = current.findChild(idx)
    if (!child) {
      const childKey = await current.key.CKD(idx)
      child = new TreeNode(childKey, current)
      current.children.push(child)
      current.sortChildren()
    }
    if (annotations[i]) child.annotation = annotations[i]
    current = child
  }
}

// ── Input handling ──

const seedInput = document.getElementById('seed-input')
const inputTypeEl = document.getElementById('input-type')
const inputErrorEl = document.getElementById('input-error')
const infoEl = document.getElementById('info-section')

let inputTimer = null
seedInput.addEventListener('input', () => {
  clearTimeout(inputTimer)
  inputTimer = setTimeout(handleInput, 200)
})

async function handleInput() {
  const raw = seedInput.value.trim()
  inputErrorEl.textContent = ''
  inputTypeEl.textContent = ''
  infoEl.textContent = ''

  if (!raw) {
    rootKey = null; treeRoot = null; render(); return
  }

  try {
    if (/^[xt]p(rv|ub)/.test(raw)) {
      inputTypeEl.textContent = raw.slice(0, 4)
      const key = await XKey.deserialize(raw)
      rootKey = key
      isMaster = key.depth === 0
      treeRoot = new TreeNode(key, null)
      render()
    } else if (/^[0-9a-fA-F]*$/.test(raw)) {
      if (raw.length % 2 !== 0) { inputErrorEl.textContent = 'hex 需要偶数字符'; return }
      if (raw.length < 32 || raw.length > 128) { inputErrorEl.textContent = `seed: 16-64 字节 (32-128 hex), 当前 ${raw.length / 2} 字节`; return }
      inputTypeEl.textContent = 'seed'
      const key = await XPrv.from(hexToBytes(raw))
      rootKey = key
      isMaster = true
      treeRoot = new TreeNode(key, null)
      render()
    } else {
      inputErrorEl.textContent = '无法识别的格式'
    }
  } catch (e) {
    inputErrorEl.textContent = e.message
  }
}

// ── Info section ──

async function updateInfo() {
  if (!rootKey) { infoEl.innerHTML = ''; return }
  const k = rootKey
  const lines = []
  lines.push(`type: ${k.is_public_key() ? 'public' : 'private'}`)
  lines.push(`network: ${k.version}`)
  lines.push(`depth: ${k.depth}`)
  if (k.depth > 0) {
    const idx = k.i
    lines.push(`index: ${idx >= HARDENED ? (idx - HARDENED) + "'" : idx}`)
    lines.push(`parent fingerprint: ${toHex(k.parent_fingerprint)}`)
  }
  const id = toHex(await k.identifier())
  const fp = id.slice(0, 8)
  const rest = id.slice(8)
  lines.push(`identifier: <span class="fingerprint">${fp}</span>${rest}`)
  infoEl.innerHTML = lines.join('\n')
}

// ── Tree layout ──

function layoutTree() {
  if (!treeRoot) return
  let leafX = 0
  assignPositions(treeRoot, 0)

  function assignPositions(node, depth) {
    node.y = depth * V_GAP + TOP_PAD
    if (node.children.length === 0) {
      node.x = leafX
      leafX += H_GAP
      return
    }
    for (const child of node.children) assignPositions(child, depth + 1)
    const first = node.children[0].x
    const last = node.children[node.children.length - 1].x
    node.x = (first + last) / 2
  }
}

function treeBounds(node) {
  let minX = node.x, maxX = node.x, maxY = node.y
  for (const ch of node.children) {
    const b = treeBounds(ch)
    if (b.minX < minX) minX = b.minX
    if (b.maxX > maxX) maxX = b.maxX
    if (b.maxY > maxY) maxY = b.maxY
  }
  return { minX, maxX, maxY }
}

// ── SVG rendering ──

const svg = document.getElementById('tree-svg')
const NS = 'http://www.w3.org/2000/svg'

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag)
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v)
  return e
}

async function render() {
  svg.innerHTML = ''
  await updateInfo()
  if (!treeRoot) { svg.removeAttribute('width'); svg.removeAttribute('height'); return }

  layoutTree()
  const b = treeBounds(treeRoot)
  const ox = -b.minX + SIDE_PAD
  const w = b.maxX - b.minX + SIDE_PAD * 2
  const h = b.maxY + TOP_PAD + 80
  svg.setAttribute('width', w)
  svg.setAttribute('height', h)
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`)

  // edges first (behind nodes)
  drawEdges(treeRoot, ox)
  // nodes on top
  drawNodes(treeRoot, ox)
}

function drawEdges(node, ox) {
  for (const ch of node.children) {
    const x1 = node.x + ox, y1 = node.y + NODE_R
    const x2 = ch.x + ox, y2 = ch.y - NODE_R
    const my = (y1 + y2) / 2
    const p = el('path', {
      d: `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`,
      class: 'edge-line' + (ch.isHardened ? ' edge-hardened' : ''),
    })
    svg.appendChild(p)
    drawEdges(ch, ox)
  }
}

function drawNodes(node, ox) {
  const cx = node.x + ox
  const cy = node.y

  // circle
  const circle = el('circle', { cx, cy, r: NODE_R, class: 'node-circle' })
  circle.addEventListener('click', () => {
    node.infoState = (node.infoState + 1) % 3
    render()
  })
  circle.addEventListener('contextmenu', e => { e.preventDefault(); showContextMenu(e, node) })
  svg.appendChild(circle)

  // label
  const lbl = el('text', { x: cx, y: cy, class: 'node-label' })
  lbl.textContent = node.label
  svg.appendChild(lbl)

  // annotation
  if (node.annotation) {
    const ann = el('text', { x: cx, y: cy + NODE_R + 14, class: 'node-annotation' })
    ann.textContent = node.annotation
    svg.appendChild(ann)
  }

  // info text (c+k or K)
  if (node.infoState > 0) {
    const infoY = cy + NODE_R + (node.annotation ? 28 : 14)
    const key = node.key
    const lines = []
    if (node.infoState === 1) {
      lines.push('c: ' + key.c.toString(16).padStart(64, '0'))
      if (!key.is_public_key()) lines.push('k: ' + key.k.toString(16).padStart(64, '0'))
    } else {
      const pub = key.is_public_key() ? key : key.N()
      lines.push('K: ' + toHex(pub.K.serialize()))
    }
    lines.forEach((line, i) => {
      const t = el('text', { x: cx, y: infoY + i * 13, class: 'node-info-text' })
      t.textContent = line
      svg.appendChild(t)
    })
  }

  // + button (right-bottom of node)
  const ADD_R = 8
  const addX = cx + NODE_R * 0.7
  const addY = cy + NODE_R * 0.7
  const addBtn = el('circle', { cx: addX, cy: addY, r: ADD_R, class: 'add-btn' })
  addBtn.addEventListener('click', e => { e.stopPropagation(); openPathPopup(node, addBtn) })
  svg.appendChild(addBtn)
  const addLbl = el('text', { x: addX, y: addY, class: 'add-btn-text' })
  addLbl.textContent = '+'
  svg.appendChild(addLbl)

  // recurse
  for (const ch of node.children) drawNodes(ch, ox)
}

// ── Path popup ──

const pathPopup = document.getElementById('path-popup')
const pathInput = pathPopup.querySelector('input')
let pathPopupNode = null
const drafts = new WeakMap()

function openPathPopup(node, btnEl) {
  // toggle: if already open for this node, save draft and close
  if (pathPopupNode === node && pathPopup.style.display === 'block') {
    drafts.set(node, pathInput.value)
    closePathPopup()
    return
  }
  // save draft of previous node if switching
  if (pathPopupNode && pathPopupNode !== node) drafts.set(pathPopupNode, pathInput.value)
  pathPopupNode = node
  const rect = btnEl.getBoundingClientRect()
  pathPopup.style.display = 'block'
  pathPopup.style.left = (rect.right + 4) + 'px'
  pathPopup.style.top = (rect.top - 4) + 'px'
  pathInput.value = drafts.get(node) || ''
  pathInput.style.borderColor = ''
  pathInput.focus()
}

function closePathPopup(clearDraft) {
  if (pathPopupNode && !clearDraft) drafts.set(pathPopupNode, pathInput.value)
  if (pathPopupNode && clearDraft) drafts.delete(pathPopupNode)
  pathPopup.style.display = 'none'
  pathPopupNode = null
}

pathInput.addEventListener('keydown', async e => {
  if (e.key === 'Escape') { closePathPopup(); return }
  if (e.key !== 'Enter') return
  const val = pathInput.value.trim()
  if (!val || !val.startsWith('/')) return
  try {
    await derivePath(pathPopupNode, val)
    closePathPopup(true)
    render()
  } catch (err) {
    pathInput.style.borderColor = '#e74c3c'
    setTimeout(() => pathInput.style.borderColor = '', 1500)
  }
})


// ── Context menu ──

const ctxMenu = document.getElementById('context-menu')
document.addEventListener('click', () => ctxMenu.style.display = 'none')

function showContextMenu(e, node) {
  ctxMenu.innerHTML = ''
  const key = node.key

  // delete (not for root)
  if (node.parent) {
    addMenuItem('删除子树', () => {
      node.parent.children = node.parent.children.filter(c => c !== node)
      render()
    })
  }

  // export prv
  if (!key.is_public_key()) {
    const tag = key.version === 'mainnet' ? 'xprv' : 'tprv'
    addMenuItem(`导出 ${tag}`, async () => {
      const s = await key.serialize()
      download(buildFilename(node, 'prv') + '.txt', s)
    })
  }

  // export pub
  const pubTag = key.version === 'mainnet' ? 'xpub' : 'tpub'
  addMenuItem(`导出 ${pubTag}`, async () => {
    const pub = key.is_public_key() ? key : key.N()
    const s = await pub.serialize()
    download(buildFilename(node, 'pub') + '.txt', s)
  })

  if (ctxMenu.children.length === 0) return
  ctxMenu.style.display = 'block'
  ctxMenu.style.left = e.clientX + 'px'
  ctxMenu.style.top = e.clientY + 'px'
}

function addMenuItem(text, onClick) {
  const d = document.createElement('div')
  d.className = 'menu-item'
  d.textContent = text
  d.addEventListener('click', e => { e.stopPropagation(); ctxMenu.style.display = 'none'; onClick() })
  ctxMenu.appendChild(d)
}

// ── Export filename ──

function buildFilename(node, type) {
  const path = node.pathFromRoot()
  const segs = []

  if (type === 'prv') {
    segs.push('m')
  } else if (isMaster) {
    segs.push('M')
  }

  for (let i = 1; i < path.length; i++) segs.push(path[i].fileSegment())

  if (type === 'pub' && !isMaster) {
    if (segs.length > 0) segs[segs.length - 1] += 'N'
    else segs.push('N')
  }

  return segs.join('-')
}

function download(name, content) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([content], { type: 'text/plain' }))
  a.download = name
  a.click()
  URL.revokeObjectURL(a.href)
}

</script>
