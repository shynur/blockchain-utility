<!DOCTYPE html>
<!--
以下是实现的指导文档 (不要删除!):

BIP 32 可视化

- 单文件, 仅依赖 ./index.mjs

不需要大标题.

有一个输入框, 根据输入自动检测输入的是什么: 16 进制文本, xprv, xpub, tprv, tpub.
输入会被校验, 16 进制文本需要是偶数字符, 其它的 base58 check 编码的文本也会被校验.
输入框会响应合法的变更, 每次变更会重新生成整棵 (子) 树.

如果输入的是 seed, 那么页面上的根节点就是 master extended private key.
否则, 是相应的扩展子私钥或子公钥.

对于页面上的节点, 根节点会标注 m/M, 其它节点标注 index.

节点有一个输入框用来输入自该节点开始要派生的路径, 输入完并确认后, 一次性全部派生.
输入多次, 会生成多颗子树, 但会执行归并.

点击节点, 该节点会显示 c (chain code) 和 k (私钥) (若可获得).
再次点击显示 K (公钥).
仿佛点击会切换显示.

节点的右键菜单有删除按钮, 用于删除整棵子树.
根节点不允许删除.

右键节点, 会弹出菜单, 可以选择导出 prv 或 pub 的 base58 check 编码.
导出时, 根据是 mainnet 还是 testnet, 自动显示 xprv/tprv 和 xpub/tpub.
导出的密钥以文件形式下载, 文件名的格式是, 举例, 如果完整的 path 是 m/1'/2, 那么文件名就是 `m-1H-2.txt`; `M/1` 就是 `M-1.txt`; `N(m/1'/2)` 就是 `m-1H-2N.txt`

父节点与子节点之间用曲线连接.
硬化派生使用虚线, 普通派生使用实线.
子节点先按照 index 排序, 如果普通派生和硬化派生的 index 相同, 普通派生在前, 硬化派生在后.
-->
