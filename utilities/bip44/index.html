<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BIP 44 Wallet</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app-shell">
        <div class="top-panels">
            <section class="panel input-panel" aria-labelledby="input-heading">
                <div class="section-head">
                    <div>
                        <h2 id="input-heading">入口</h2>
                        <p>助记词仅支持英文; 如果输入以完整 xpub/xprv 开头, 会自动切换到导入模式。</p>
                    </div>
                    <div id="input-mode-badge" class="badge">mnemonic</div>
                </div>

                <label class="field">
                    <span>word / xpub / xprv</span>
                    <textarea id="root-input" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="abandon ability ... 或 xpub/xprv"></textarea>
                    <small id="root-help">输入空白会隐藏刚完成的 word; 追加一个空格可隐藏最后一个 word。</small>
                    <small id="root-error" class="error" role="alert"></small>
                </label>

                <label id="passphrase-wrap" class="field compact-field">
                    <span>passphrase</span>
                    <input id="passphrase-input" type="text" spellcheck="false" autocomplete="off" placeholder="允许空格, 禁止其它空白字符">
                    <small id="passphrase-help">允许普通空格, 禁止其它空白字符; 每个字符显示为 *。</small>
                </label>
            </section>

            <section class="panel status-panel" aria-labelledby="status-heading">
                <div class="section-head">
                    <div>
                        <h2 id="status-heading">状态</h2>
                        <p id="status-line">等待输入。</p>
                    </div>
                </div>
                <div id="root-info" class="info-grid"></div>
            </section>
        </div>

        <section class="panel path-panel" aria-labelledby="path-heading">
            <div class="section-head">
                <div>
                    <h2 id="path-heading">Path 选择</h2>
                    <p id="path-summary" class="path-summary">m/44'/0'/0'/0/{address_index}</p>
                </div>
                <button id="derive-now" class="ghost-button" type="button">重新计算</button>
            </div>

            <label id="reference-path-wrap" class="field hidden">
                <span>导入 key 的已走过 path 备注</span>
                <input id="reference-path-input" type="text" placeholder="例如 m/44'/0'/0' 或 m/?/?/0'">
                <small>仅供你自己参考, 不参与计算。</small>
            </label>

            <div class="path-grid">
                <div class="path-card locked" data-path-card="purpose">
                    <div>
                        <span class="path-label">purpose'</span>
                        <strong>44'</strong>
                    </div>
                    <div class="kind-picks" data-kind-group="purpose"></div>
                </div>

                <div class="path-card" data-path-card="coin">
                    <label class="field inline-field">
                        <span>coin_type'</span>
                        <select id="coin-type"></select>
                    </label>
                    <div class="kind-picks" data-kind-group="coin"></div>
                </div>

                <div class="path-card" data-path-card="account">
                    <label class="field inline-field account-field">
                        <span>account'</span>
                        <span class="suffix-input">
                            <input id="account-input" type="text" inputmode="numeric" value="0" size="1">
                            <b>H</b>
                        </span>
                    </label>
                    <small id="account-error" class="error"></small>
                    <div class="kind-picks" data-kind-group="account"></div>
                </div>

                <div class="path-card" data-path-card="change">
                    <div class="switch-row">
                        <span class="path-label">change</span>
                        <button id="change-switch" class="switch" type="button" aria-pressed="false"><span></span></button>
                    </div>
                    <p id="change-note" class="path-note">0: external / receiving addresses</p>
                    <div class="kind-picks" data-kind-group="change"></div>
                </div>

                <div class="path-card address-card" data-path-card="address">
                    <label class="field inline-field">
                        <span>address_index</span>
                        <input id="address-index-input" type="text" inputmode="numeric" placeholder="按 Enter 添加">
                    </label>
                    <div id="address-index-list" class="chip-list"></div>
                    <small id="address-error" class="error"></small>
                    <div class="kind-picks" data-kind-group="address"></div>
                </div>

            </div>
        </section>

        <section class="panel output-panel" aria-labelledby="output-heading">
            <div class="section-head">
                <div>
                    <h2 id="output-heading">生成结果</h2>
                    <p>xprv 默认隐藏, 点击每条结果里的显示按钮可临时查看。</p>
                </div>
            </div>
            <div id="outputs" class="outputs empty">有效输入出现后会在这里显示。</div>
        </section>
    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
